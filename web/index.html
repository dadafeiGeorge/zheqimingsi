<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EB" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>哲启明思 v1.2.0 (2026.11.27) · 哲学典藏阅读与电台</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('lumen_reader_settings_v1');
          var theme = raw ? (JSON.parse(raw).theme || 'paper') : 'paper';
          var map = {
            paper: ['#F7F3EB', '#231F1B'],
            sepia: ['#ECE1CB', '#2C2319'],
            night: ['#121418', '#E5DFD3'],
            sage: ['#CDDCD1', '#15241C']
          };
          var cfg = map[theme] || map.paper;
          if (!map[theme]) theme = 'paper';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.backgroundColor = cfg[0];
          root.style.color = cfg[1];
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', cfg[0]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
